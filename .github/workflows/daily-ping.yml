# Keeps the Render backend awake. Render's free plan puts it to sleep after ~15 minutes
# with no traffic, and the next real request then waits 50+ seconds for it to wake up.
# Pinging every 10 minutes (under that 15-minute window) keeps it warm, so staff and
# customers never hit a cold start. This also naturally triggers the ledger's daily jobs
# (due-date reminder emails), which run on the first request of each day.
#
# This is a free workaround, not a guarantee: GitHub can delay a scheduled run under load,
# and if one is ever late the next real visitor still pays the 50-second wake-up cost.
# The only guaranteed fix is Render's paid Starter plan, which removes sleep mode entirely.
name: Keep backend awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health
        run: curl -fsS --retry 2 --retry-delay 10 --max-time 60 https://esicom-backend.onrender.com/api/health/
